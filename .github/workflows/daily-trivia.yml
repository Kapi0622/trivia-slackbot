name: daily-trivia

on:
  schedule:
    # UTC 22:00 = 日本時間 翌朝 7:00。届く時刻を変えたい場合はここを編集します。
    # 例) 朝 6:00 にしたい → "0 21 * * *" / 朝 8:00 → "0 23 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 「Actions」タブから手動でも実行できます（動作確認用）

# history.jsonl をコミットするために書き込み権限が必要です
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存をインストール
        run: pip install -r requirements.txt

      - name: 雑学を生成して Slack に投稿
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python generate_trivia.py

      - name: 履歴の更新をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.jsonl
          if git diff --staged --quiet; then
            echo "履歴に変更はありませんでした"
          else
            git commit -m "chore: update trivia history"
            git push
          fi
